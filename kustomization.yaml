apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/inventory-deployment.yaml
  - k8s/inventory-service.yaml
  - k8s/client-deployment.yaml

configMapGenerator:
  - name: inventory-app
    files:
      - app/inventory.py
  - name: client-app
    files:
      - client/client.py

generatorOptions:
  disableNameSuffixHash: true
