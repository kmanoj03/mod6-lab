apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: python:3.12-alpine
          command: ["python", "-u", "/app/client.py"]
          env:
            - name: INVENTORY_URL
              value: http://inventory-service:8080/items
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: client-app
